workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^chore: release/'
      variables:
        RELEASE_COMMIT: "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - test
  - build
  - release

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  GIT_DEPTH: 1
  GIT_STRATEGY: fetch

.rust-cache: &rust-cache
  cache:
    key: rust-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - rust-${CI_DEFAULT_BRANCH}
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/

# Validation jobs run only on MR pipelines.
# Code is already validated before reaching main -- no need to re-check.
# Release MRs from release-plz only bump Cargo.toml + CHANGELOG, no code changes --
# skip validation to save CI time.
.only-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^chore: release/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

cargo-fmt:
  extends: .only-mr
  stage: check
  image: rust:1.86.0
  <<: *rust-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

cargo-clippy:
  extends: .only-mr
  stage: check
  image: rust:1.86.0
  <<: *rust-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

cargo-audit:
  extends: .only-mr
  stage: check
  image: rust:1.86.0
  <<: *rust-cache
  before_script:
    - export PATH="${CI_PROJECT_DIR}/.cargo/bin:$PATH"
  script:
    - cargo install cargo-audit --locked
    - cargo audit
  allow_failure: false

unit-tests:
  extends: .only-mr
  stage: test
  image: rust:1.86.0
  <<: *rust-cache
  needs:
    - cargo-clippy
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace

doc-tests:
  extends: .only-mr
  stage: test
  image: rust:1.86.0
  <<: *rust-cache
  needs:
    - cargo-clippy
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace --doc

